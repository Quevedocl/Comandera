<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Comandera · Panel del restaurante</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f2f3f5;--card:#fff;--ln:#e3e5e8;--tx:#1f2328;--mu:#6b7280;--red:#e5484d;--amb:#f5a524;--grn:#1f9d55;--ink:#1f2328;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--tx);font:15px/1.4 var(--f);overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.top{display:flex;align-items:center;gap:24px;padding:0 20px;padding-top:env(safe-area-inset-top,0px);height:calc(60px + env(safe-area-inset-top,0px));background:#fff;border-bottom:1px solid var(--ln);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mk{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:#fff}
.mk svg{width:16px;height:16px}
nav{display:flex;height:100%}
nav button{position:relative;border:0;background:none;padding:0 16px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:8px;transition:color .2s}
nav button.on{color:var(--tx)}
nav button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ink);transform:scaleX(0);transition:transform .25s}
nav button.on::after{transform:scaleX(1)}
#cnt{background:var(--red);color:#fff;border-radius:99px;min-width:22px;height:22px;padding:0 6px;font:700 12px/22px var(--f);text-align:center;font-style:normal}
#cnt[data-v="0"]{display:none}
.r{margin-left:auto;display:flex;align-items:center;gap:14px}
.live{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mu);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grn);animation:live 2s infinite}
#clk{font-weight:700;font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:#fff;display:grid;place-items:center;color:var(--mu);transition:all .2s}
.ib[aria-pressed=true]{color:var(--grn);border-color:var(--grn);background:#effaf3}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:fade .3s}.view[hidden]{display:none}
.tbr{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:#fff;font-weight:600;color:var(--mu);transition:all .2s}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg b{font-variant-numeric:tabular-nums;font-size:13px;opacity:.8}
select,.srch{height:38px;border-radius:10px;border:1px solid var(--ln);background:#fff;padding:0 12px}
.sp{margin-left:auto}
.gh,.pri{height:38px;padding:0 16px;border-radius:10px;font-weight:600;transition:all .2s}
.gh{border:1px solid var(--ln);background:#fff}.gh:hover{background:var(--bg)}
.pri{border:0;background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px}.pri:hover{background:#000}.pri:active,.gh:active{transform:scale(.97)}
/* pedidos */
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:4px 20px 24px;align-content:start;align-items:start}
.grid:not(:has(.tk:not([hidden]):not(.leave)))::after{content:"No hay pedidos en esta vista";grid-column:1/-1;text-align:center;color:var(--mu);padding:80px 0;font-weight:600}
.tk{--c:var(--red);--ct:#fff;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.06);animation:in .4s cubic-bezier(.2,1.2,.3,1) both}
.tk[hidden]{display:none}
.tk.preparing{--c:var(--amb);--ct:#2b1d00}.tk.ready{--c:var(--grn)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--c);color:var(--ct);transition:background .35s}
.mn{display:block;font-size:22px;line-height:1.1}.hd small{opacity:.85;font-weight:600}
.rt{text-align:right;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
.lt{display:none;font-size:11px;font-weight:700;background:rgba(0,0,0,.22);color:#fff;border-radius:6px;padding:1px 7px;margin-bottom:2px}
.late .lt{display:block}
.tk ul{list-style:none;margin:0;padding:6px 16px}
.tk li{display:flex;flex-wrap:wrap;gap:0 12px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:16px}
.tk li:last-child{border:0}.tk li b{min-width:26px}
.nt{flex-basis:100%;padding-left:38px;font-size:13.5px;font-weight:600;color:#b45309}
.go{border:0;border-top:1px solid var(--ln);padding:15px;font-weight:700;font-size:15px;background:var(--bg);transition:background .2s,color .2s,filter .2s}
.go:hover{filter:brightness(.96)}.go:active{filter:brightness(.9)}.go:disabled{opacity:.5}
.pending .go{background:var(--amb);color:#2b1d00}.preparing .go{background:var(--grn);color:#fff}.ready .go{background:var(--ink);color:#fff}
.tk.nuevo{animation:in .4s both,ping 1s .4s 3}
.tk.moved{animation:move .5s}
.tk.leave{animation:out .3s forwards;pointer-events:none}
/* carta */
.srch{display:flex;align-items:center;gap:8px;min-width:220px;color:var(--mu)}.srch input{border:0;outline:0;background:none;width:100%;color:var(--tx)}
.stt{color:var(--mu);font-size:13.5px;font-weight:600}
.pg{flex:1;min-height:0;overflow-y:auto;padding:0 20px 28px;max-width:980px;width:100%}
.pg h3{margin:20px 0 8px;font-size:14px;color:var(--mu);font-weight:700}
.lst{background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.rw{display:grid;grid-template-columns:44px 1fr auto 104px 52px;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--ln);transition:background .4s}
.rw:last-child{border:0}.rw.saved{animation:saved 1s}
.stag .rw{animation:in .35s both;animation-delay:calc(var(--i)*25ms)}
.ph{width:44px;height:44px;border-radius:10px;background:var(--bg) center/cover;display:grid;place-items:center;font-weight:700;color:var(--mu)}
.nm b{display:block;font-weight:600}.nm small{color:var(--mu)}
.rw.off .nm b{color:var(--mu);text-decoration:line-through}
.pi{display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;border:1px solid var(--ln);border-radius:9px;color:var(--mu);font-weight:600}
.pi:focus-within{border-color:#2563eb}.pi input{width:84px;border:0;outline:0;background:none;text-align:right;font-weight:700;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums}
.st{font-size:13px;font-weight:600;color:var(--grn)}.rw.off .st{color:var(--red)}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:#c9ced6;position:relative;cursor:pointer;margin:0;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.sw:checked{background:var(--grn)}.sw:checked::after{transform:translateX(20px)}
dialog{border:0;border-radius:16px;padding:24px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--tx)}
dialog[open]{animation:pop .25s cubic-bezier(.2,1.3,.3,1)}dialog::backdrop{background:rgba(20,24,30,.45)}
dialog h3{margin:0 0 4px;font-size:20px}
dialog label{display:block;margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--mu)}
dialog input{width:100%;height:42px;padding:0 12px;border:1px solid var(--ln);border-radius:9px;outline:0}dialog input:focus{border-color:#2563eb}
dialog input[type=file]{height:auto;padding:9px 12px}
.bt{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
#bn{position:fixed;top:12px;left:50%;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translate(-50%,-150%);transition:transform .4s cubic-bezier(.2,1.3,.3,1)}
#bn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}#bn.on{transform:translate(-50%,0)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:all .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:20px}
#login[hidden]{display:none}
#lf{width:min(380px,100%);background:#fff;border:1px solid var(--ln);border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(16,24,40,.08);animation:pop .3s}
#lf h2{margin:14px 0 2px;font-size:22px}#lf p{margin:0;color:var(--mu)}
#lf label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--mu)}
#lf input{width:100%;height:44px;padding:0 12px;border:1px solid var(--ln);border-radius:9px;outline:0}#lf input:focus{border-color:#2563eb}
#lf .pri{width:100%;height:46px;justify-content:center;margin-top:18px}
#lerr{color:var(--red)!important;font-size:13.5px;font-weight:600;min-height:20px;margin-top:10px!important}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes out{to{opacity:0;transform:scale(.95)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes move{0%{transform:scale(.97)}50%{transform:scale(1.02)}}
@keyframes ping{50%{box-shadow:0 0 0 3px rgba(229,72,77,.45)}}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(31,157,85,.5)}100%{box-shadow:0 0 0 8px rgba(31,157,85,0)}}
@keyframes saved{30%{background:#e7f7ed}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:720px){
 .top{gap:8px;padding:0 12px}.brand span.t,.live,#clk{display:none}nav button{padding:0 12px}
 .tbr{padding:12px}.grid{padding:4px 12px 20px;grid-template-columns:1fr}.pg{padding:0 12px 24px}
 .sp{margin-left:0}.gh span{display:none}
 .rw{grid-template-columns:44px 1fr auto 48px;gap:10px;padding:10px 12px}.st{display:none}.pi input{width:68px}
}
.rw2{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln);flex-wrap:wrap}.rw2:last-child{border:0}.rw2 .nm{flex:1;min-width:160px}.rw2 .nm small{color:var(--mu);word-break:break-all;font-size:12px}
.empty{text-align:center;color:var(--mu);padding:50px 0;font-weight:600}
dialog select{width:100%;height:42px;padding:0 10px;border:1px solid var(--ln);border-radius:9px;background:#fff}
dialog input[type=checkbox]{width:auto;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}[hidden]{display:none!important}
#scd{width:min(700px,94vw)}#scl{max-height:44vh;overflow:auto;margin-top:10px}.sr{display:grid;grid-template-columns:24px 1fr 140px 84px;gap:6px;margin-bottom:6px;align-items:center}.sr input{height:36px}
.tf{display:flex;gap:10px;padding:0 20px 14px;max-width:980px}.tf input{flex:1;height:38px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;background:#fff}
#qrb{display:grid;place-items:center;margin:16px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span class="t">Comandera</span></div>
  <nav>
    <button data-v="orders" class="on">Pedidos<i id="cnt" data-v="0"></i></button>
    <button data-v="menu">Carta</button>
    <button data-v="promos">Promos</button>
    <button data-v="tables">Mesas</button>
  </nav>
  <div class="r">
    <span class="live" id="mode"></span>
    <time id="clk"></time>
    <button class="ib" id="logout" hidden aria-label="Cerrar sesión" title="Cerrar sesión"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button>
    <button class="ib" id="snd" aria-pressed="false" aria-label="Alerta sonora" title="Alerta sonora"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6"/></svg></button>
  </div>
</header>

<main>
  <section class="view" id="orders">
    <div class="tbr">
      <div class="seg" id="seg">
        <button data-f="" class="on">Todos <b>0</b></button>
        <button data-f="pending">Nuevos <b>0</b></button>
        <button data-f="preparing">En preparación <b>0</b></button>
        <button data-f="ready">Listos <b>0</b></button>
      </div>
      <select id="mesa" aria-label="Filtrar por mesa"></select>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="view" id="menu" hidden>
    <div class="tbr">
      <label class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Buscar producto"></label>
      <div class="seg" id="chips"></div>
      <span class="stt sp" id="stt"></span>
      <button class="gh" id="scan">Escanear carta</button><button class="pri" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir producto</button>
    </div>
    <div class="pg" id="pg"></div>
  </section>

  <section class="view" id="promos" hidden>
    <div class="tbr"><span class="stt">Descuentos que verán tus clientes en la carta</span><button class="pri sp" id="newpromo">Nueva promoción</button></div>
    <div class="pg" id="pl"></div>
  </section>

  <section class="view" id="tables" hidden>
    <div class="tbr"><span class="stt">Cada mesa tiene su enlace para QR o NFC</span></div>
    <form class="tf" id="tf"><input id="tn" placeholder="Nombre de la mesa (Ej. Mesa 5, Terraza 2, Barra)" maxlength="30"><button class="pri">Crear mesa</button></form>
    <div class="pg" id="tl"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h3>Nuevo producto</h3>
    <label for="f-name">Nombre</label><input id="f-name" required>
    <label for="f-cat">Categoría</label><input id="f-cat" required list="cats"><datalist id="cats"></datalist>
    <label for="f-price">Precio</label><input id="f-price" type="number" min="0" step="1" inputmode="numeric" required>
    <label for="f-img">Foto (opcional)</label><input id="f-img" type="file" accept="image/*">
    <div class="bt"><button type="button" class="gh" id="cancel">Cancelar</button><button class="pri" type="submit">Guardar producto</button></div>
  </form>
</dialog>
<dialog id="pd"><div>
  <h3>Nueva promoción</h3>
  <label>Tipo</label><select id="p-type"><option value="nxm">2x1, 3x2… (lleva N, paga M)</option><option value="percent">% de descuento</option><option value="price">Precio especial</option><option value="info">Solo aviso (sin descuento)</option></select>
  <div id="p-prod"><label>Producto</label><select id="p-pid"></select></div>
  <div class="two" id="p-nxm"><div><label>Lleva</label><input id="p-buy" type="number" min="2" value="2"></div><div><label>Paga</label><input id="p-pay" type="number" min="1" value="1"></div></div>
  <div id="p-val" hidden><label id="p-vl"></label><input id="p-v" type="number" min="1"></div>
  <label>Título (opcional)</label><input id="p-title" maxlength="60" placeholder="Ej. 2x1 en pizzas los martes">
  <label>Válida hasta (opcional)</label><input id="p-end" type="date">
  <div class="bt"><button type="button" class="gh" id="p-cancel">Cancelar</button><button type="button" class="pri" id="p-save">Crear promoción</button></div>
</div></dialog>
<dialog id="scd"><div>
  <h3>Escanear carta</h3><p class="stt" style="margin:4px 0 0">Sube una o varias fotos de tu carta (máx. 6). Revisarás todo antes de guardar.</p>
  <label for="scf">Fotos de la carta</label><input id="scf" type="file" accept="image/*" multiple>
  <p class="stt" id="scm"></p><div id="scl"></div>
  <div class="bt"><button type="button" class="gh" id="sc-x">Cerrar</button><button type="button" class="gh" id="scgo">Leer carta</button><button type="button" class="pri" id="scs" hidden>Guardar seleccionados</button></div>
</div></dialog>
<dialog id="qrd"><div style="text-align:center"><h3 id="qrt"></h3><div id="qrb"></div><div class="bt" style="justify-content:center"><button class="gh" id="qrdl">Descargar PNG</button><button class="gh" id="qrx">Cerrar</button></div></div></dialog>
<div id="login" hidden>
  <form id="lf">
    <span class="mk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>
    <h2>Comandera</h2><p>Ingresa o crea la cuenta de tu restaurante</p>
    <div id="rn" hidden><label for="lr">Nombre del restaurante</label><input id="lr" maxlength="50"></div>
    <label for="le">Correo</label><input id="le" type="email" required autocomplete="username">
    <label for="lp">Contraseña</label><input id="lp" type="password" required autocomplete="current-password">
    <p id="lerr" role="alert"></p>
    <button class="pri" id="lsub" type="submit">Ingresar</button><button type="button" class="gh" id="sw" style="width:100%;margin-top:10px">Crear cuenta nueva</button>
  </form>
</div>
<div id="bn" role="alert"></div><div id="toast" role="status"></div>

<script>
/* ===== CONFIGURACIÓN: proyecto Supabase "Comandera". La clave es la pública (anon); la seguridad
   la dan las políticas RLS y el login del personal. Vacío = modo demostración local. ===== */
const CFG = { url: 'https://pmctlwsqkrpesyfozmwo.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtY3Rsd3Nxa3JwZXN5Zm96bXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NDI0OTEsImV4cCI6MjEwNzQxODQ5MX0.t7M8-Whzia4odHN5_dBZar-kPcPnKLCgFXsb9D6uPz0' };

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = n => '$' + Number(n).toLocaleString('es-CL');
const pid = v => isNaN(v) ? v : Number(v);
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); };

/* ===== CAPA DE DATOS ===== */
const sb = CFG.url && window.supabase ? supabase.createClient(CFG.url, CFG.key) : null;
let R = null; // restaurante de la sesión
const api = {
  async load() {
    const q = n => sb.from(n).select('*').eq('restaurant_id', R.id);
    const [p, o, pr, t] = await Promise.all([q('products').order('category').order('name'), q('orders').neq('status', 'completed').order('created_at'), q('promotions').order('created_at'), q('dining_tables').order('created_at')]);
    if ([p, o, pr, t].some(x => x.error)) toast('No se pudieron cargar los datos');
    return { products: p.data || [], orders: o.data || [], promos: pr.data || [], tables: t.data || [] };
  },
  async setProduct(id, patch) { await sb.from('products').update(patch).eq('id', id); },
  async addProduct(p, file) {
    if (file) { const path = R.id + '/' + Date.now() + '-' + file.name.replace(/[^\w.]/g, '_'); const up = await sb.storage.from('products').upload(path, file); if (!up.error) p.image_url = sb.storage.from('products').getPublicUrl(path).data.publicUrl; }
    await sb.from('products').insert({ ...p, restaurant_id: R.id });
  },
  async addMany(rows) { await sb.from('products').insert(rows.map(r => ({ ...r, restaurant_id: R.id }))); },
  async add(table, row) { const { error } = await sb.from(table).insert({ ...row, restaurant_id: R.id }); if (error) toast('No se pudo guardar'); },
  async upd(table, id, patch) { await sb.from(table).update(patch).eq('id', id); },
  async del(table, id) { await sb.from(table).delete().eq('id', id); },
  async setStatus(id, status) { await sb.from('orders').update({ status }).eq('id', id); },
  watch(cb) { let c = sb.channel('comandera'); ['orders', 'products', 'promotions', 'dining_tables'].forEach(t => c = c.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: 'restaurant_id=eq.' + R.id }, cb)); c.subscribe(); }
};

/* ===== ESTADO ===== */
let data = { products: [], orders: [], promos: [], tables: [] }, view = 'orders', sf = '', mf = '', seen = null, soundOn = false, ctx, mq = '', mcat = '';
const map = new Map();
const LBL = { pending: ['Marcar en preparación', 'preparing'], preparing: ['Pedido listo', 'ready'], ready: ['Cerrar / Cobrar mesa', 'completed'] };
const tn = o => o.table_name || 'Mesa ' + o.table_number;
const mins = iso => Math.floor((Date.now() - new Date(iso)) / 6e4);

/* ===== SONIDO Y AVISOS ===== */
function beep() {
  if (!soundOn) return;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  [880, 660, 880].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * .2; o.frequency.value = f; g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .2); });
}
$('#snd').onclick = e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn); toast(soundOn ? 'Alerta sonora activada' : 'Alerta sonora desactivada'); if (soundOn) beep(); };
let bt;
function alertNew(list) {
  beep(); const b = $('#bn');
  b.textContent = list.length > 1 ? `${list.length} pedidos nuevos` : `Nuevo pedido · ${tn(list[0])}`;
  b.classList.add('on'); clearTimeout(bt); bt = setTimeout(() => b.classList.remove('on'), 3500);
}

/* ===== PEDIDOS ===== */
function ticketHTML(o) {
  const n = (o.items || []).reduce((a, i) => a + Number(i.qty || 0), 0);
  return `<div class="hd"><div><b class="mn">${esc(tn(o))}</b><small>${n} ${n === 1 ? 'ítem' : 'ítems'}</small></div><div class="rt"><span class="lt">Atrasado</span><span class="ago"></span></div></div>
  <ul>${(o.items || []).map(i => `<li><b>${esc(i.qty)}×</b><span>${esc(i.name)}</span>${i.promo ? `<span class="nt">🏷 ${esc(i.promo)}</span>` : ''}${i.note ? `<span class="nt">${esc(i.note)}</span>` : ''}</li>`).join('')}</ul><button class="go"></button>`;
}
function renderOrders() {
  const ids = new Set(data.orders.map(o => o.id)), fresh = [];
  [...data.orders].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach((o, i) => {
    let el = map.get(o.id);
    if (!el) {
      el = document.createElement('article'); el.className = 'tk'; el.dataset.id = o.id; el.innerHTML = ticketHTML(o); map.set(o.id, el); $('#grid').appendChild(el);
      if (seen && o.status === 'pending') { fresh.push(o); el.classList.add('nuevo'); }
    } else if (el.dataset.st && el.dataset.st !== o.status) { el.classList.remove('nuevo', 'moved'); void el.offsetWidth; el.classList.add('moved'); }
    el.classList.remove('pending', 'preparing', 'ready'); el.classList.add(o.status);
    el.dataset.st = o.status; el._t = o.created_at;
    const g = el.querySelector('.go'); g.textContent = LBL[o.status][0]; g.dataset.to = LBL[o.status][1]; g.disabled = false;
    el.style.order = i; el.hidden = (sf && o.status !== sf) || (mf && tn(o) !== mf);
  });
  for (const [id, el] of map) if (!ids.has(id)) { el.classList.add('leave'); setTimeout(() => el.remove(), 300); map.delete(id); }
  seen = ids; tick(); counts(); mesas();
  if (fresh.length) alertNew(fresh);
}
function tick() {
  for (const el of map.values()) {
    const m = mins(el._t);
    el.querySelector('.ago').textContent = m < 1 ? 'Recién' : m + ' min';
    el.classList.toggle('late', el.dataset.st !== 'ready' && m >= 10);
  }
}
function counts() {
  const c = { '': data.orders.length, pending: 0, preparing: 0, ready: 0 }; data.orders.forEach(o => c[o.status]++);
  $$('#seg button').forEach(b => b.querySelector('b').textContent = c[b.dataset.f]);
  const cn = $('#cnt'); cn.textContent = c.pending || ''; cn.dataset.v = c.pending;
}
function mesas() {
  const nums = [...new Set(data.orders.map(tn))].sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
  if (mf && !nums.includes(mf)) mf = '';
  $('#mesa').innerHTML = '<option value="">Todas las mesas</option>' + nums.map(n => `<option value="${esc(n)}"${n === mf ? ' selected' : ''}>${esc(n)}</option>`).join('');
}
$('#mesa').onchange = e => { mf = e.target.value; renderOrders(); };
$('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; sf = b.dataset.f; $$('#seg button').forEach(x => x.classList.toggle('on', x === b)); renderOrders(); };
$('#grid').addEventListener('click', async e => {
  const b = e.target.closest('.go'); if (!b) return; b.disabled = true;
  await api.setStatus(pid(b.closest('.tk').dataset.id), b.dataset.to);
  if (b.dataset.to === 'completed') toast('Mesa cerrada y cobrada');
  await refresh();
});

/* ===== CARTA ===== */
function menuMeta() {
  const on = data.products.filter(p => p.is_available).length;
  $('#stt').textContent = `${on} disponibles · ${data.products.length - on} agotados`;
  const cats = [...new Set(data.products.map(p => p.category))];
  $('#cats').innerHTML = [...new Set([...cats, ...SUGG])].map(c => `<option value="${esc(c)}">`).join('');
  $('#chips').innerHTML = ['', ...cats].map(c => `<button data-c="${esc(c)}" class="${c === mcat ? 'on' : ''}">${c ? esc(c) : 'Todo'}</button>`).join('');
}
function renderMenu(stagger) {
  const pg = $('#pg'), q = mq.toLowerCase(), cats = [...new Set(data.products.map(p => p.category))];
  if (stagger) { pg.classList.add('stag'); setTimeout(() => pg.classList.remove('stag'), 1000); }
  let i = 0;
  pg.innerHTML = cats.filter(c => !mcat || c === mcat).map(c => {
    const rows = data.products.filter(p => p.category === c && (!q || p.name.toLowerCase().includes(q)));
    return rows.length ? `<h3>${esc(c)}</h3><div class="lst">${rows.map(p => `<div class="rw${p.is_available ? '' : ' off'}" style="--i:${i++}">
      <div class="ph" style="${p.image_url ? `background-image:url('${esc(p.image_url)}')` : ''}">${p.image_url ? '' : esc(p.name[0])}</div>
      <div class="nm"><b>${esc(p.name)}</b><small>${esc(p.category)}</small></div>
      <label class="pi">$<input type="number" min="0" step="1" inputmode="numeric" value="${p.price}" data-id="${p.id}" aria-label="Precio de ${esc(p.name)}"></label>
      <span class="st">${p.is_available ? 'Disponible' : 'Agotado'}</span>
      <input class="sw" type="checkbox" role="switch" ${p.is_available ? 'checked' : ''} data-id="${p.id}" aria-label="Disponible: ${esc(p.name)}"></div>`).join('')}</div>` : '';
  }).join('') || `<p style="text-align:center;color:var(--mu);padding:60px 0">${data.products.length ? 'No hay productos que coincidan.' : 'Aún no hay productos. Añade el primero con el botón de arriba.'}</p>`;
}
$('#pg').addEventListener('change', async e => {
  const el = e.target, id = pid(el.dataset.id), row = el.closest('.rw'); if (id === undefined) return;
  if (el.type === 'checkbox') { row.classList.toggle('off', !el.checked); row.querySelector('.st').textContent = el.checked ? 'Disponible' : 'Agotado'; await api.setProduct(id, { is_available: el.checked }); toast(el.checked ? 'Plato disponible' : 'Plato marcado como agotado'); }
  else { const v = Math.max(0, Math.round(Number(el.value) || 0)); el.value = v; await api.setProduct(id, { price: v }); row.classList.remove('saved'); void row.offsetWidth; row.classList.add('saved'); toast('Precio guardado · ' + clp(v)); }
  data = await api.load(); menuMeta();
});
$('#pg').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.type === 'number') e.target.blur(); });
$('#q').oninput = e => { mq = e.target.value; renderMenu(); };
$('#chips').onclick = e => { const b = e.target.closest('button'); if (!b) return; mcat = b.dataset.c; menuMeta(); renderMenu(true); };
$('#add').onclick = () => { $('#frm').reset(); $('#dlg').showModal(); };
$('#cancel').onclick = () => $('#dlg').close();
$('#frm').addEventListener('submit', async () => {
  await api.addProduct({ name: $('#f-name').value.trim(), category: $('#f-cat').value.trim(), price: Number($('#f-price').value), is_available: true, image_url: null }, $('#f-img').files[0]);
  toast('Producto añadido'); await refresh(); renderMenu(true);
});

/* ===== NAVEGACIÓN Y ARRANQUE ===== */
$$('nav button').forEach(b => b.onclick = () => {
  view = b.dataset.v; $$('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['orders', 'menu', 'promos', 'tables'].forEach(v => $('#' + v).hidden = view !== v);
  if (view === 'menu') { menuMeta(); renderMenu(true); }
});
async function refresh() {
  data = await api.load(); renderOrders(); menuMeta(); renderPromos(); renderTables();
  if (view === 'menu' && !(document.activeElement && document.activeElement.closest('#pg'))) renderMenu();
}
const clk = () => $('#clk').textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
clk(); setInterval(clk, 10000); setInterval(tick, 10000);
$('#mode').textContent = sb ? 'En vivo' : 'Modo demo';
/* ===== CATEGORÍAS SUGERIDAS ===== */
const SUGG = ['Entradas','Para compartir','Ensaladas','Sopas','Platos de fondo','Carnes','Pescados y mariscos','Pastas','Pizzas','Hamburguesas','Sándwiches','Sushi','Tacos y mexicano','Parrilla','Comida rápida','Vegetariano','Menú del día','Menú infantil','Acompañamientos','Postres','Helados','Desayunos','Cafetería','Té e infusiones','Jugos y batidos','Bebidas','Cervezas','Vinos','Cócteles','Tragos y licores'];

/* ===== ESCANEAR CARTA ===== */
const shrink = f => new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .82).split(',')[1]); URL.revokeObjectURL(im.src); }; im.src = URL.createObjectURL(f); });
$('#scan').onclick = () => { $('#scf').value = ''; $('#scl').innerHTML = ''; $('#scm').textContent = ''; $('#scs').hidden = true; $('#scgo').disabled = false; $('#scd').showModal(); };
$('#sc-x').onclick = () => $('#scd').close();
$('#scgo').onclick = async () => {
  const fs = [...$('#scf').files]; if (!fs.length) return toast('Elige una foto de la carta');
  $('#scgo').disabled = true; $('#scm').textContent = 'Leyendo la carta… puede tardar unos segundos';
  const images = await Promise.all(fs.slice(0, 6).map(shrink));
  const { data: d, error } = await sb.functions.invoke('scan-menu', { body: { images } });
  $('#scgo').disabled = false;
  if (error || !d?.items?.length) { $('#scm').textContent = 'No se pudo leer la carta. Prueba con una foto más nítida y bien iluminada.'; return; }
  $('#scm').textContent = `Encontré ${d.items.length} productos. Corrige lo que haga falta antes de guardar.`;
  $('#scl').innerHTML = d.items.map(x => `<div class="sr"><input type="checkbox" checked aria-label="Incluir"><input data-k="name" value="${esc(x.name)}" aria-label="Nombre"><input data-k="category" list="cats" value="${esc(x.category)}" aria-label="Categoría"><input data-k="price" type="number" min="0" value="${esc(x.price)}" aria-label="Precio"></div>`).join('');
  $('#scs').hidden = false;
};
$('#scs').onclick = async () => {
  const rows = $$('#scl .sr').filter(r => r.querySelector('[type=checkbox]').checked).map(r => { const g = k => r.querySelector(`[data-k=${k}]`).value.trim(); return { name: g('name'), category: g('category') || 'Otros', price: Math.max(0, Math.round(Number(g('price')) || 0)), is_available: true }; }).filter(r => r.name);
  if (!rows.length) return; await api.addMany(rows); $('#scd').close(); toast(rows.length + ' productos añadidos'); await refresh(); renderMenu(true);
};

/* ===== PROMOCIONES ===== */
const live = x => x.is_active && (!x.ends_on || x.ends_on >= new Date().toISOString().slice(0, 10));
const pname = id => (data.products.find(p => String(p.id) === String(id)) || {}).name || 'producto eliminado';
const promoDesc = x => x.type === 'nxm' ? `${x.buy_qty}x${x.pay_qty} en ${pname(x.product_id)}` : x.type === 'percent' ? `${x.value}% de descuento en ${pname(x.product_id)}` : x.type === 'price' ? `${pname(x.product_id)} a ${clp(x.value)}` : 'Aviso informativo';
function renderPromos() {
  $('#pl').innerHTML = data.promos.length ? `<div class="lst">${data.promos.map(x => `<div class="rw2"><div class="nm"><b>${esc(x.title)}</b><small>${esc(promoDesc(x))}${x.ends_on ? ' · hasta ' + esc(x.ends_on) : ''}${live(x) ? '' : ' · inactiva'}</small></div><input class="sw" type="checkbox" role="switch" ${x.is_active ? 'checked' : ''} data-id="${x.id}" aria-label="Activa"><button class="gh" data-del="promotions" data-id="${x.id}">Borrar</button></div>`).join('')}</div>` : '<p class="empty">Aún no hay promociones. Crea la primera (2x1, 3x2, % de descuento…).</p>';
}
const pform = () => { const t = $('#p-type').value; $('#p-prod').hidden = t === 'info'; $('#p-nxm').hidden = t !== 'nxm'; $('#p-val').hidden = !(t === 'percent' || t === 'price'); $('#p-vl').textContent = t === 'percent' ? 'Descuento (%)' : 'Precio promocional ($)'; };
$('#p-type').onchange = pform;
$('#newpromo').onclick = () => { $('#p-title').value = $('#p-end').value = $('#p-v').value = ''; $('#p-pid').innerHTML = data.products.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join(''); pform(); $('#pd').showModal(); };
$('#p-cancel').onclick = () => $('#pd').close();
$('#p-save').onclick = async () => {
  const t = $('#p-type').value, buy = +$('#p-buy').value, pay = +$('#p-pay').value, v = +$('#p-v').value, title = $('#p-title').value.trim();
  if (t !== 'info' && !$('#p-pid').value) return toast('Elige un producto');
  if (t === 'nxm' && !(buy > pay && pay >= 1)) return toast('"Lleva" debe ser mayor que "Paga"');
  if ((t === 'percent' || t === 'price') && !(v > 0 && (t === 'price' || v <= 100))) return toast('Revisa el valor');
  if (t === 'info' && !title) return toast('Escribe el aviso');
  const row = { type: t, product_id: t === 'info' ? null : $('#p-pid').value, buy_qty: t === 'nxm' ? buy : null, pay_qty: t === 'nxm' ? pay : null, value: t === 'percent' || t === 'price' ? v : null, ends_on: $('#p-end').value || null, is_active: true };
  row.title = title || promoDesc(row);
  await api.add('promotions', row); $('#pd').close(); toast('Promoción creada'); await refresh();
};
$('#pl').addEventListener('change', async e => { await api.upd('promotions', e.target.dataset.id, { is_active: e.target.checked }); await refresh(); });

/* ===== MESAS (enlace directo para QR / NFC) ===== */
const linkOf = t => new URL('carta.html?r=' + R.slug + '&t=' + t.id, location.href).href;
function renderTables() {
  $('#tl').innerHTML = data.tables.length ? `<div class="lst">${data.tables.map(t => `<div class="rw2"><div class="nm"><b>${esc(t.name)}</b><small>${esc(linkOf(t))}</small></div><button class="gh" data-cp="${t.id}">Copiar enlace</button><button class="gh" data-qr="${t.id}">QR</button><button class="gh" data-del="dining_tables" data-id="${t.id}">Borrar</button></div>`).join('')}</div>` : '<p class="empty">Crea tu primera mesa. Cada una genera un enlace único para grabar en NFC o imprimir como QR.</p>';
}
$('#tf').onsubmit = async e => { e.preventDefault(); const n = $('#tn').value.trim(); if (!n) return; await api.add('dining_tables', { name: n }); $('#tn').value = ''; toast('Mesa creada'); await refresh(); };
$('#tl').addEventListener('click', async e => {
  const b = e.target.closest('[data-cp],[data-qr]'); if (!b) return;
  const t = data.tables.find(x => String(x.id) === (b.dataset.cp || b.dataset.qr));
  if (b.dataset.cp) { try { await navigator.clipboard.writeText(linkOf(t)); toast('Enlace copiado'); } catch (_) { prompt('Copia el enlace:', linkOf(t)); } }
  else { $('#qrt').textContent = t.name; $('#qrb').innerHTML = ''; new QRCode($('#qrb'), { text: linkOf(t), width: 240, height: 240 }); $('#qrd').showModal(); }
});
$('#qrx').onclick = () => $('#qrd').close();
$('#qrdl').onclick = () => { const a = document.createElement('a'); a.href = $('#qrb canvas').toDataURL('image/png'); a.download = 'qr-' + $('#qrt').textContent + '.png'; a.click(); };
$('main').addEventListener('click', async e => { const b = e.target.closest('[data-del]'); if (!b || !confirm('¿Borrar? Esta acción no se puede deshacer.')) return; await api.del(b.dataset.del, b.dataset.id); await refresh(); });

/* ===== SESIÓN: cada restaurante entra con su correo y contraseña ===== */
let started = false, signup = false;
async function start() {
  if (started) return;
  if (!sb) { toast('Sin conexión'); return; }
  const { data: d } = await sb.auth.getSession();
  if (!d.session) { $('#login').hidden = false; return; }
  const u = d.session.user;
  let { data: r } = await sb.from('restaurants').select('*').eq('owner_id', u.id).maybeSingle();
  if (!r) {
    const name = (u.user_metadata && u.user_metadata.restaurant_name) || 'Mi restaurante';
    const slug = (name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'resto') + '-' + Math.random().toString(36).slice(2, 6);
    ({ data: r } = await sb.from('restaurants').insert({ name, slug, owner_id: u.id }).select().single());
  }
  if (!r) { toast('No se pudo crear el restaurante'); return; }
  R = r; $('.brand .t').textContent = r.name; $('#logout').hidden = false;
  started = true; api.watch(refresh); refresh();
}
$('#sw').onclick = () => { signup = !signup; $('#rn').hidden = !signup; $('#lr').required = signup; $('#lsub').textContent = signup ? 'Crear cuenta' : 'Ingresar'; $('#sw').textContent = signup ? 'Ya tengo cuenta' : 'Crear cuenta nueva'; $('#lerr').textContent = ''; };
$('#lf').onsubmit = async e => {
  e.preventDefault(); $('#lerr').textContent = '';
  const email = $('#le').value.trim(), password = $('#lp').value;
  const { data: d, error } = signup ? await sb.auth.signUp({ email, password, options: { data: { restaurant_name: $('#lr').value.trim() } } }) : await sb.auth.signInWithPassword({ email, password });
  if (error) { $('#lerr').textContent = signup ? error.message : 'Correo o contraseña incorrectos.'; return; }
  if (!d.session) { $('#lerr').textContent = 'Revisa tu correo para confirmar la cuenta y luego ingresa.'; return; }
  $('#lp').value = ''; $('#login').hidden = true; start();
};
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
start();
</script>
