<!-- Supabase > Authentication > Emails > Templates > "Reset Password"
     Pega este contenido en el cuerpo y pon como asunto: "Código para cambiar tu contraseña de VAestilo"
     (debe contener {{ .Token }}; sin eso llegaría un link y el panel pide un código) -->
<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:420px;margin:0 auto;padding:24px;color:#1f2328">
  <h2 style="margin:0 0 8px">Cambia tu contraseña</h2>
  <p style="margin:0 0 16px;color:#6b7280">Escribe este código en VAestilo, junto a tu nueva contraseña:</p>
  <p style="font-size:34px;font-weight:700;letter-spacing:8px;margin:0 0 16px;padding:14px;background:#f2f3f5;border-radius:12px;text-align:center">{{ .Token }}</p>
  <p style="margin:0;color:#6b7280;font-size:13px">Si no lo pediste, ignora este correo: tu contraseña no cambia. El código vence en poco tiempo.</p>
</div>
