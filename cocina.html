<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>VAestilo · Cocina</title><link rel="icon" href="icons/favicon.svg"><script src="config.js"></script>
<style>
:root{--ink:#2F3D35;--tx:#2A322D;--acc:#4E7162;--acc2:#3F5C50;--accs:#EDF2EE;--accs2:#DCE7E0;--bg:#F6F7F4;--ln:#E8EAE5;--new:#6D93BD;--prep:#D3A441;--rdy:#5E8C73;--bad:#B85450;--mut:#7A857E;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--ln)}header b{font:600 20px var(--serif)}header .sp{flex:1}
.pill{font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;background:#ECEEE9;color:var(--mut)}.pill.ok{background:var(--accs2);color:var(--acc2)}
#warn{background:#F8ECEB;color:#8F3F3B;text-align:center;padding:10px;font-weight:600;border-bottom:1px solid #EBCFCD}
#cols{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:18px 20px;overflow:hidden}
.col{display:flex;flex-direction:column;min-height:0}.col h2{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.col .l{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.c0 h2,.c1 h2,.c2 h2{color:var(--mut)}
.c0 h2::before,.c1 h2::before,.c2 h2::before{content:"";width:9px;height:9px;border-radius:50%;margin-right:8px;display:inline-block}.c0 h2::before{background:var(--new)}.c1 h2::before{background:var(--prep)}.c2 h2::before{background:var(--rdy)}
.col h2{justify-content:flex-start}.col h2 span,.col h2 b{margin-left:auto}
.empty{color:var(--mut);text-align:center;padding:28px 0}
.t{background:#fff;border:1px solid var(--ln);border-radius:18px;border-top:4px solid var(--new);padding:16px}.t.s-preparing{border-top-color:var(--prep)}.t.s-ready{border-top-color:var(--rdy)}.t.s-cancelled{border-top-color:var(--bad);background:#FBF3F2}
.t.fresh{animation:fl 1s ease-in-out 6}@keyframes fl{50%{box-shadow:0 0 0 4px rgba(109,147,189,.4)}}@media(prefers-reduced-motion:reduce){.t.fresh{animation:none;box-shadow:0 0 0 3px rgba(109,147,189,.4)}}
.t .h{display:flex;justify-content:space-between;align-items:baseline}.t .h b{font-size:24px;font-weight:700}.t .tm{color:var(--mut);font-weight:500}.tm.warn{color:#B07F1D}.tm.late{color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:#EAF0F7;color:#3D5A80;margin-top:4px}.tag.x{background:#F6E9E8;color:#8F3F3B}
.t ul{list-style:none;margin:10px 0;padding:0;font-size:18px}.t li{padding:4px 0}.t li b{margin-right:6px}.t small{display:block;color:var(--mut);font-size:14px}.t .nt{display:block;background:#FBF1DB;border-radius:8px;padding:3px 10px;margin-top:3px;font-size:15px;color:#6F5217}
.t button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--accs2);color:var(--acc2);cursor:pointer;transition:background .2s}.t button:hover{background:#CFDDD4}.t button.go{background:var(--acc);color:#fff}.t button.go:hover{background:var(--acc2)}.t button.back{background:#ECEEE9;color:var(--mut);font-size:14px;padding:9px;margin-top:8px}.t button:disabled{opacity:.5}
#gate{position:fixed;inset:0;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}#gate h1{margin:0;font:600 34px var(--serif)}#gate p{max-width:420px;color:var(--mut);margin:0}
#go{padding:16px 32px;font-size:17px;font-weight:600;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}#go:hover{background:var(--acc2)}
@media(max-width:760px){#cols{grid-template-columns:1fr;overflow:auto}.col .l{overflow:visible}}
</style></head><body>
<div id="gate"><h1>Cocina</h1><p id="gname">Verificando enlace…</p><p id="gmsg"></p><button id="go" hidden>Iniciar turno</button></div>
<header><b id="rn">VAestilo</b><span class="sp"></span><span class="pill" id="pw">Pantalla</span><span class="pill" id="ps">Sonido</span></header>
<div id="warn" hidden>Sin conexión con el servidor · reintentando… Si dura, avisa al encargado.</div>
<main id="cols">
<section class="col c0"><h2>Nuevos <span id="n0">0</span></h2><div class="l" id="l0"></div></section>
<section class="col c1"><h2>Preparando <span id="n1">0</span></h2><div class="l" id="l1"></div></section>
<section class="col c2"><h2>Listos <span id="n2">0</span></h2><div class="l" id="l2"></div></section>
</main>
<script>
const CFG = window.FOGON || {}, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let K = (new URLSearchParams(location.search).get('k') || '').trim();
if (K) { try { localStorage.setItem('kepasa-cocina', K); } catch (e) {} history.replaceState(null, '', location.pathname); }   // la llave no queda en la barra ni en el historial
else { try { K = localStorage.getItem('kepasa-cocina') || ''; } catch (e) {} }
async function rpc(fn, args) {
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'content-type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error(r.status); return r.json();
}
let started = false, ac = null, wl = null, rows = [], seen = null, fresh = new Set(), dismissed = new Set(), fails = 0, busy = false;
function beep() {
  if (!ac) return; try { [880, 1175, 880].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination); const t = ac.currentTime + i * .22; g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); o.start(t); o.stop(t + .21); }); } catch (e) {}
}
async function keepAwake() { try { if (navigator.wakeLock && !document.hidden) { wl = await navigator.wakeLock.request('screen'); wl.onrelease = () => { $('#pw').className = 'pill'; $('#pw').textContent = 'Pantalla: se puede apagar'; }; $('#pw').className = 'pill ok'; $('#pw').textContent = 'Pantalla activa'; return; } } catch (e) {} $('#pw').textContent = 'Mantén la pantalla encendida'; }
const mins = c => Math.max(0, Math.floor((Date.now() - new Date(c)) / 60000));
function ticket(o) {
  const m = mins(o.created_at), t = o.status === 'cancelled' ? '' : `<span class="tm ${m >= 20 ? 'late' : m >= 10 ? 'warn' : ''}">${m < 1 ? 'ahora' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + m % 60 + ' min'}</span>`;
  const li = (o.items || []).map(i => `<li><b>${esc(i.qty)}×</b>${esc(i.name)}${(i.addons || []).map(a => `<small>+ ${esc(a)}</small>`).join('')}${i.promo ? `<small>${esc(i.promo)}</small>` : ''}${i.note ? `<span class="nt">» ${esc(i.note)}</span>` : ''}</li>`).join('');
  const btn = { pending: `<button class="go" data-id="${o.id}" data-to="preparing">Preparar</button>`, preparing: `<button class="go" data-id="${o.id}" data-to="ready">Marcar como listo</button><button class="back" data-id="${o.id}" data-to="pending">↩ Volver a nuevos</button>`, ready: `<button class="back" data-id="${o.id}" data-to="preparing">↩ Volver a preparando</button>`, cancelled: `<button data-x="${o.id}">Entendido</button>` }[o.status] || '';
  return `<article class="t s-${o.status}${fresh.has(o.id) ? ' fresh' : ''}"><div class="h"><b>${esc(o.table_name)}</b>${t}</div>${o.status === 'cancelled' ? '<span class="tag x">CANCELADO · no preparar</span>' : o.modified_at ? '<span class="tag">MODIFICADO</span>' : ''}<ul>${li}</ul>${btn}</article>`;
}
function render() {
  const g = [[], [], []];
  rows.forEach(o => { if (o.status === 'cancelled') { if (!dismissed.has(o.id)) g[0].push(o); } else g[{ pending: 0, preparing: 1, ready: 2 }[o.status]]?.push(o); });
  const L = document.querySelectorAll('.col .l'), N = document.querySelectorAll('.col h2 span');
  g.forEach((a, i) => { L[i].innerHTML = a.length ? a.map(ticket).join('') : '<p class="empty">Sin pedidos</p>'; N[i].textContent = a.length; });
}
async function poll() {
  if (busy) return; busy = true;
  try {
    rows = await rpc('kitchen_orders', { p_key: K });
    if (!rows.length && (await rpc('kitchen_info', { p_key: K })) == null) { location.reload(); return; }   // enlace desactivado
    fails = 0; $('#warn').hidden = true;
    const sig = new Map(rows.map(o => [o.id, o.status + '|' + o.modified_at + '|' + o.cancelled_at])); let ring = false;
    if (seen) rows.forEach(o => { const s = seen.get(o.id); if ((o.status === 'pending' && s === undefined) || (s !== undefined && s.split('|')[1] !== String(o.modified_at)) || (o.status === 'cancelled' && s !== undefined && !s.startsWith('cancelled'))) { ring = true; fresh.add(o.id); } });
    seen = sig; fresh.forEach(id => { const o = rows.find(x => x.id === id); if (!o || o.status !== 'pending' && o.status !== 'cancelled') fresh.delete(id); });
    render(); if (ring) beep();
  } catch (e) { if (++fails >= 2) $('#warn').hidden = false; } finally { busy = false; }
}
$('#cols').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.x) { dismissed.add(b.dataset.x); render(); return; }
  b.disabled = true;
  try { const r = await rpc('kitchen_set_status', { p_key: K, p_order: b.dataset.id, p_status: b.dataset.to }); if (r !== 'ok') alert(r === 'closed' ? 'Ese pedido ya se cerró o se canceló.' : 'No se pudo cambiar el estado.'); } catch (x) { alert('Sin conexión: no se guardó el cambio.'); }
  busy = false; poll();
});
async function init() {
  if (!CFG.url || !UUID.test(K)) { $('#gname').textContent = 'Enlace de cocina inválido'; $('#gmsg').textContent = 'Pide al encargado el enlace desde Configuración > Pantalla de cocina.'; return; }
  let name = null; try { name = await rpc('kitchen_info', { p_key: K }); } catch (e) { $('#gname').textContent = 'Sin conexión'; $('#gmsg').textContent = 'Revisa el internet y recarga.'; return; }
  if (!name) { $('#gname').textContent = 'Enlace desactivado'; $('#gmsg').textContent = 'Este enlace ya no sirve. Pide uno nuevo al encargado.'; return; }
  $('#rn').textContent = name; document.title = name + ' · Cocina'; $('#gname').textContent = name; $('#gmsg').textContent = 'Al iniciar se activa el sonido de pedidos nuevos y se mantiene la pantalla encendida.'; $('#go').hidden = false;
}
$('#go').onclick = () => {
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  $('#ps').className = ac ? 'pill ok' : 'pill'; $('#ps').textContent = ac ? 'Sonido activo' : 'Sin sonido';
  started = true; keepAwake(); $('#gate').hidden = true; poll(); setInterval(poll, 4000); setInterval(render, 20000);
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && started) { keepAwake(); if (ac) ac.resume(); poll(); } });
init();
</script></body></html>
