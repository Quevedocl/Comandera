<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Carta · Haz tu pedido</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f2f3f5;--card:#fff;--ln:#e3e5e8;--tx:#1f2328;--mu:#6b7280;--red:#e5484d;--grn:#1f9d55;--ink:#1f2328;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--f)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

/* cabecera fija */
.sticky{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.mesa{font-weight:700;font-size:14px;background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px}
.mesa:empty{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:#fff;font-weight:600;color:var(--mu);transition:background .2s,color .2s,border-color .2s}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* carta */
main{padding:4px 12px calc(120px + env(safe-area-inset-bottom,0px))}
section{scroll-margin-top:118px}
section h2{margin:22px 4px 8px;font-size:15px;color:var(--mu);font-weight:700}
.lst{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.it{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--ln)}
.it:last-child{border:0}
.ph{width:64px;height:64px;border-radius:12px;background:var(--bg) center/cover;display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--mu)}
.nm b{display:block;font-weight:600;line-height:1.25}
.pr{font-weight:700;font-variant-numeric:tabular-nums;color:var(--tx)}
.it.off .nm b,.it.off .pr{color:var(--mu)}
.it.off .ph{opacity:.45}
.ag{font-size:13px;font-weight:700;color:var(--red)}
.add,.stp button{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .15s}
.add:active,.stp button:active{transform:scale(.88)}
.stp{display:flex;align-items:center;gap:2px}
.stp b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.stp button:first-child{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.msg{text-align:center;color:var(--mu);padding:70px 20px;font-weight:600}
.msg button{margin-top:14px}

/* barra del pedido */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,rgba(242,243,245,0))}
#bar[hidden]{display:none}
#open{display:flex;align-items:center;gap:12px;width:100%;max-width:616px;margin:0 auto;height:56px;padding:0 18px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(16,24,40,.25)}
#open span:nth-child(2){flex:1;text-align:left}
#bn{min-width:26px;height:26px;border-radius:99px;background:#fff;color:var(--ink);font-size:14px;line-height:26px;text-align:center;padding:0 7px}
#bar.bump #open{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.03)}}

/* hoja del pedido */
dialog{border:0;padding:0;width:100%;max-width:640px;max-height:92dvh;margin:auto auto 0;border-radius:20px 20px 0 0;color:var(--tx);background:#fff}
dialog[open]{display:flex;flex-direction:column;animation:sheet .28s cubic-bezier(.2,1,.3,1)}
dialog::backdrop{background:rgba(20,24,30,.5)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.sh h3{margin:0;font-size:20px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:20px;line-height:1;color:var(--mu)}
#lines{list-style:none;margin:0;padding:0 20px;overflow-y:auto;flex:1;min-height:80px}
#lines li{padding:14px 0;border-bottom:1px solid var(--ln)}
#lines li:last-child{border:0}
.l1{display:flex;align-items:center;gap:12px}
.l1 .nm{flex:1}
.l1 small{display:block;color:var(--mu);font-weight:600}
.note{width:100%;height:40px;margin-top:10px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;outline:0;background:var(--bg);font-size:15px}
.note:focus{border-color:#2563eb;background:#fff}
.ft{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:12px;font-variant-numeric:tabular-nums}
.mz label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:6px}
.mz input{width:100%;height:46px;padding:0 14px;border:1px solid var(--ln);border-radius:10px;outline:0;font-size:18px;font-weight:700}
.mz input:focus{border-color:#2563eb}
.mz{margin-bottom:12px}.mz[hidden]{display:none}
#err{color:var(--red);font-size:14px;font-weight:600;margin:0 0 10px;min-height:0}
#err:empty{display:none}
.pri{display:block;width:100%;height:54px;border:0;border-radius:14px;background:var(--grn);color:#fff;font-weight:700;font-size:17px;transition:filter .2s,transform .15s}
.pri:active{transform:scale(.98)}.pri:disabled{opacity:.6}
.gh{height:44px;padding:0 18px;border:1px solid var(--ln);border-radius:12px;background:#fff;font-weight:600}
.pri.dk{background:var(--ink)}

/* pantalla de confirmación */
#done{position:fixed;inset:0;z-index:30;background:#fff;display:grid;place-items:center;padding:24px;text-align:center}
#done[hidden]{display:none}
#done>div{max-width:340px;animation:pop .35s cubic-bezier(.2,1.3,.3,1)}
.ok{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:var(--grn);display:grid;place-items:center}
.ok svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#done h2{margin:0 0 6px;font-size:26px}
#done p{margin:0 0 24px;color:var(--mu)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:90vw;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:all .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
.tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:6px;padding:2px 8px}
.promos{margin:16px 0 0}.pm{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--ln);background:#fffbeb}.pm:last-child{border:0}
</style>
</head>
<body>
<div class="sticky">
  <div class="wrap">
    <div class="top"><h1 id="ttl">Carta</h1><span class="mesa" id="mesaTag"></span></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<main class="wrap" id="menu"><p class="msg">Cargando carta…</p></main>

<div id="bar" hidden>
  <button id="open"><span id="bn">0</span><span>Ver pedido</span><b id="bt"></b></button>
</div>

<dialog id="cart" aria-labelledby="ct">
  <div class="sh"><h3 id="ct">Tu pedido</h3><button class="x" id="close" aria-label="Cerrar">×</button></div>
  <ul id="lines"></ul>
  <div class="ft">
    <div class="tot"><span>Total</span><span id="tot"></span></div>
    <div class="mz" id="mz" hidden><label for="mesaIn">Tu mesa</label><input id="mesaIn" maxlength="30" autocomplete="off" placeholder="Ej. 5 o Terraza 2"></div>
    <p id="err" role="alert"></p>
    <button class="pri" id="send">Enviar pedido</button>
  </div>
</dialog>

<div id="done" hidden>
  <div>
    <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Pedido enviado</h2>
    <p id="doneTxt"></p>
    <button class="pri dk" id="again">Pedir algo más</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
/* ===== CONFIGURACIÓN: mismo proyecto Supabase que la comandera ===== */
const CFG = { url: 'https://pmctlwsqkrpesyfozmwo.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtY3Rsd3Nxa3JwZXN5Zm96bXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NDI0OTEsImV4cCI6MjEwNzQxODQ5MX0.t7M8-Whzia4odHN5_dBZar-kPcPnKLCgFXsb9D6uPz0' };
let NOMBRE = 'Carta', RID = null, TID = null;
const MAX_QTY = 20;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = n => '$' + Number(n).toLocaleString('es-CL');
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); };

const sb = window.supabase ? supabase.createClient(CFG.url, CFG.key) : null;
let CART_KEY = 'carta-pedido-v1';

/* mesa: viene del QR (?mesa=5); si no, se la pedimos al enviar */
const QS = new URLSearchParams(location.search), SLUG = (QS.get('r') || '').trim(), TID_Q = (QS.get('t') || '').trim();
let mesa = '', lastMesa = '', promos = [];

let products = [], cart = new Map(), spy = null;
const find = id => products.find(p => String(p.id) === id);

/* ===== carrito (se recuerda si recargan la página) ===== */
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify([...cart.values()])); } catch (e) {} }
function loadCart() { try { (JSON.parse(localStorage.getItem(CART_KEY)) || []).forEach(l => cart.set(l.id, l)); } catch (e) {} }
const count = () => [...cart.values()].reduce((a, l) => a + l.qty, 0);
const live = x => x.is_active && (!x.ends_on || x.ends_on >= new Date().toISOString().slice(0, 10));
const promoFor = id => promos.find(x => live(x) && x.type !== 'info' && String(x.product_id) === String(id));
const disc = l => { const x = promoFor(l.id); if (!x) return 0; const g = l.qty * l.price;
  if (x.type === 'nxm') return Math.floor(l.qty / x.buy_qty) * (x.buy_qty - x.pay_qty) * l.price;
  if (x.type === 'percent') return Math.round(g * x.value / 100);
  if (x.type === 'price') return Math.max(0, l.price - x.value) * l.qty; return 0; };
const total = () => [...cart.values()].reduce((a, l) => a + l.qty * l.price - disc(l), 0);
const badge = p => { const x = promoFor(p.id); return x ? `<span class="tag">🏷 ${esc(x.title)}</span>` : ''; };
const promoBox = () => { const l = promos.filter(live); return l.length ? `<div class="promos"><h2 style="margin:0 4px 8px;font-size:15px;color:var(--mu)">Promociones</h2><div class="lst">${l.map(x => `<div class="pm">🏷 ${esc(x.title)}</div>`).join('')}</div></div>` : ''; };

/* quita del pedido lo que ya no existe o se agotó, y actualiza precios; devuelve los nombres quitados */
function prune() {
  const gone = [];
  for (const [id, l] of cart) {
    const p = find(id);
    if (!p || !p.is_available) { gone.push(l.name); cart.delete(id); }
    else { l.price = Number(p.price); l.name = p.name; }
  }
  if (gone.length) saveCart();
  return gone;
}

/* ===== carta ===== */
const ctl = p => {
  if (!p.is_available) return '<span class="ag">Agotado</span>';
  const l = cart.get(String(p.id));
  return l
    ? `<div class="stp"><button data-a="dec" aria-label="Quitar uno de ${esc(p.name)}">−</button><b>${l.qty}</b><button data-a="inc" aria-label="Agregar uno de ${esc(p.name)}">+</button></div>`
    : `<button class="add" data-a="inc" aria-label="Agregar ${esc(p.name)}">+</button>`;
};

function render() {
  const cats = [...new Set(products.map(p => p.category))];
  if (!cats.length) { $('#menu').innerHTML = '<p class="msg">La carta aún no tiene productos.</p>'; $('#chips').innerHTML = ''; return; }
  $('#chips').innerHTML = cats.map((c, i) => `<button data-c="c${i}" class="${i === 0 ? 'on' : ''}">${esc(c)}</button>`).join('');
  $('#menu').innerHTML = promoBox() + cats.map((c, i) => `<section id="c${i}"><h2>${esc(c)}</h2><div class="lst">${
    products.filter(p => p.category === c).map(p => `<article class="it${p.is_available ? '' : ' off'}" data-id="${esc(p.id)}">
      <div class="ph" style="${p.image_url ? `background-image:url('${esc(p.image_url)}')` : ''}">${p.image_url ? '' : esc((p.name || '?')[0])}</div>
      <div class="nm"><b>${esc(p.name)}</b><span class="pr">${clp(p.price)}</span>${badge(p)}</div>
      <div class="ctl">${ctl(p)}</div></article>`).join('')}</div></section>`).join('');
  watchSections();
}

function watchSections() {
  if (spy) spy.disconnect();
  spy = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', b.dataset.c === e.target.id));
    const on = document.querySelector('#chips button.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }), { rootMargin: '-130px 0px -65% 0px' });
  document.querySelectorAll('main section').forEach(s => spy.observe(s));
}

function refreshCtl(id) {
  const row = [...document.querySelectorAll('.it')].find(r => r.dataset.id === id), p = find(id);
  if (row && p) row.querySelector('.ctl').innerHTML = ctl(p);
}

function bar() {
  const n = count();
  $('#bar').hidden = n === 0;
  $('#bn').textContent = n; $('#bt').textContent = clp(total());
}

function change(id, d) {
  const p = find(id); if (!p || !p.is_available) return;
  const l = cart.get(id) || { id, name: p.name, price: Number(p.price), qty: 0, note: '' };
  l.qty = Math.min(MAX_QTY, l.qty + d);
  if (l.qty <= 0) cart.delete(id); else cart.set(id, l);
  saveCart(); refreshCtl(id); bar();
  if (d > 0) { const b = $('#bar'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  if ($('#cart').open) renderCart();
}

$('#menu').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  change(b.closest('.it').dataset.id, b.dataset.a === 'inc' ? 1 : -1);
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.getElementById(b.dataset.c)?.scrollIntoView({ behavior: 'smooth' });
});

/* ===== hoja del pedido ===== */
function renderCart() {
  const lines = [...cart.values()];
  if (!lines.length) { $('#cart').close(); return; }
  $('#lines').innerHTML = lines.map(l => `<li data-id="${esc(l.id)}">
    <div class="l1"><div class="nm"><b>${esc(l.name)}</b><small>${clp(l.price * l.qty - disc(l))}${disc(l) ? ' · ' + esc(promoFor(l.id).title) : ''}</small></div>
    <div class="stp"><button data-a="dec" aria-label="Quitar uno de ${esc(l.name)}">−</button><b>${l.qty}</b><button data-a="inc" aria-label="Agregar uno de ${esc(l.name)}">+</button></div></div>
    <input class="note" maxlength="80" placeholder="Nota (ej. sin cebolla)" value="${esc(l.note)}" aria-label="Nota para ${esc(l.name)}"></li>`).join('');
  $('#tot').textContent = clp(total());
  $('#send').textContent = 'Enviar pedido · ' + clp(total());
  $('#mz').hidden = !!mesa;
  if (!mesa && !$('#mesaIn').value) $('#mesaIn').value = lastMesa;
}
$('#open').onclick = () => { $('#err').textContent = ''; renderCart(); $('#cart').showModal(); };
$('#close').onclick = () => $('#cart').close();
$('#cart').addEventListener('click', e => { if (e.target === $('#cart')) $('#cart').close(); });
$('#lines').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  change(b.closest('li').dataset.id, b.dataset.a === 'inc' ? 1 : -1);
});
$('#lines').addEventListener('input', e => {
  if (!e.target.classList.contains('note')) return;
  const l = cart.get(e.target.closest('li').dataset.id); if (l) { l.note = e.target.value; saveCart(); }
});

/* ===== enviar pedido a la comandera ===== */
const fail = m => { $('#err').textContent = m; };
$('#send').onclick = async () => {
  fail('');
  const t = mesa || $('#mesaIn').value.trim();
  if (!t) { fail('Escribe tu mesa.'); $('#mesaIn').focus(); return; }
  if (!sb) { fail('Sin conexión con el restaurante. Avisa a un mesero.'); return; }

  await load();                                  // revisa disponibilidad justo antes de enviar
  const gone = lastGone; lastGone = [];
  if (gone.length) { renderCart(); fail('Se agotó: ' + gone.join(', ') + '. Lo quitamos de tu pedido.'); return; }
  if (!cart.size) { $('#cart').close(); return; }

  const btn = $('#send'); btn.disabled = true; btn.textContent = 'Enviando…';
  const items = [...cart.values()].map(l => ({ id: l.id, name: l.name, qty: l.qty, price: l.price, note: l.note.trim() || undefined, promo: disc(l) ? promoFor(l.id).title : undefined }));
  const { error } = await sb.from('orders').insert({ restaurant_id: RID, table_id: TID, table_name: t, items, total: total(), status: 'pending' });
  btn.disabled = false;
  if (error) { btn.textContent = 'Enviar pedido · ' + clp(total()); fail('No se pudo enviar el pedido. Revisa tu conexión e inténtalo otra vez.'); return; }

  lastMesa = t;
  cart.clear(); saveCart(); $('#cart').close();
  [...document.querySelectorAll('.it')].forEach(r => refreshCtl(r.dataset.id)); bar();
  $('#doneTxt').textContent = `Lo recibimos en cocina para la mesa ${t}.`;
  $('#done').hidden = false;
};
$('#again').onclick = () => { $('#done').hidden = true; window.scrollTo({ top: 0 }); };

/* ===== datos en vivo ===== */
let lastGone = [];
async function load() {
  if (!sb) { $('#menu').innerHTML = '<p class="msg">No se pudo conectar. Avisa a un mesero.</p>'; return; }
  if (!RID) return;
  const [pr, pm] = await Promise.all([sb.from('products').select('*').eq('restaurant_id', RID).order('category').order('name'), sb.from('promotions').select('*').eq('restaurant_id', RID)]);
  const { data, error } = pr; promos = pm.data || [];
  if (error) {
    if (!products.length) $('#menu').innerHTML = '<p class="msg">No pudimos cargar la carta.<br><button class="gh" onclick="load()">Reintentar</button></p>';
    return;
  }
  products = data || [];
  const gone = prune(); lastGone = lastGone.concat(gone);
  render(); bar();
  if (gone.length) { toast('Se agotó: ' + gone.join(', ')); if ($('#cart').open) renderCart(); }
}

async function init() {
  const bad = m => { $('#menu').innerHTML = `<p class="msg">${m}</p>`; };
  if (!sb || !SLUG) return bad('Enlace inválido. Escanea de nuevo el QR de tu mesa.');
  const { data: r } = await sb.from('restaurants').select('id,name').eq('slug', SLUG).maybeSingle();
  if (!r) return bad('No encontramos este restaurante. Avisa a un mesero.');
  RID = r.id; NOMBRE = r.name; CART_KEY += '-' + RID;
  if (TID_Q) { const { data: t } = await sb.from('dining_tables').select('id,name').eq('id', TID_Q).eq('restaurant_id', RID).maybeSingle(); if (t) { TID = t.id; mesa = t.name; $('#mesaTag').textContent = t.name; } }
  $('#ttl').textContent = NOMBRE; document.title = NOMBRE + ' · Haz tu pedido';
  loadCart(); load();
  const f = 'restaurant_id=eq.' + RID;
  sb.channel('carta').on('postgres_changes', { event: '*', schema: 'public', table: 'products', filter: f }, () => load()).on('postgres_changes', { event: '*', schema: 'public', table: 'promotions', filter: f }, () => load()).subscribe();
}
init();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
